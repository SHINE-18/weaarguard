<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2154 354" width="2154" height="354">
  <defs>
    <!-- Border gradient - complex gold with dark edges -->
    <linearGradient id="borderGrad" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0"    stop-color="#2a1800"/>
      <stop offset="0.08" stop-color="#7a4e08"/>
      <stop offset="0.18" stop-color="#e8c060"/>
      <stop offset="0.28" stop-color="#c8920a"/>
      <stop offset="0.38" stop-color="#5a3800"/>
      <stop offset="0.50" stop-color="#3a2200"/>
      <stop offset="0.62" stop-color="#5a3800"/>
      <stop offset="0.72" stop-color="#c8920a"/>
      <stop offset="0.82" stop-color="#e8c060"/>
      <stop offset="0.92" stop-color="#7a4e08"/>
      <stop offset="1"    stop-color="#2a1800"/>
    </linearGradient>

    <!-- Inner border highlight gradient -->
    <linearGradient id="innerBorderGrad" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0"    stop-color="#8B5e0a" stop-opacity="0.6"/>
      <stop offset="0.3"  stop-color="#f5d888" stop-opacity="0.4"/>
      <stop offset="0.7"  stop-color="#f5d888" stop-opacity="0.4"/>
      <stop offset="1"    stop-color="#8B5e0a" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Text fill gradient - silver-gold metallic -->
    <linearGradient id="textFill" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0"    stop-color="#6b4400"/>
      <stop offset="0.08" stop-color="#b07820"/>
      <stop offset="0.20" stop-color="#f8f0d8"/>
      <stop offset="0.35" stop-color="#e8d090"/>
      <stop offset="0.48" stop-color="#c8a030"/>
      <stop offset="0.55" stop-color="#d4b050"/>
      <stop offset="0.65" stop-color="#f8f0d8"/>
      <stop offset="0.78" stop-color="#d4a030"/>
      <stop offset="0.90" stop-color="#a07020"/>
      <stop offset="1"    stop-color="#5a3800"/>
    </linearGradient>

    <!-- Text stroke gradient -->
    <linearGradient id="textStroke" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0"   stop-color="#1a0c00"/>
      <stop offset="0.3" stop-color="#5a3800"/>
      <stop offset="0.5" stop-color="#3a2000"/>
      <stop offset="0.7" stop-color="#5a3800"/>
      <stop offset="1"   stop-color="#1a0c00"/>
    </linearGradient>

    <!-- Shadow for depth -->
    <filter id="textShadow" x="-2%" y="-5%" width="110%" height="120%">
      <feDropShadow dx="3" dy="4" stdDeviation="4" flood-color="#1a0c00" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- Outer badge border - thick gold -->
  <rect x="8" y="8" width="2138" height="338" rx="58" ry="58"
        fill="none"
        stroke="url(#borderGrad)"
        stroke-width="28"/>

  <!-- Inner thin accent line -->
  <rect x="30" y="30" width="2094" height="294" rx="40" ry="40"
        fill="none"
        stroke="url(#innerBorderGrad)"
        stroke-width="3"/>

  <!-- WEARGUARD text - stroke first (paint-order puts stroke behind fill) -->
  <text
    x="1077" y="278"
    font-family="Impact, 'Arial Narrow', Arial, sans-serif"
    font-style="italic"
    font-size="262"
    font-weight="900"
    letter-spacing="2"
    fill="url(#textFill)"
    stroke="url(#textStroke)"
    stroke-width="10"
    text-anchor="middle"
    paint-order="stroke fill"
    filter="url(#textShadow)">WEARGUARD</text>
</svg>
